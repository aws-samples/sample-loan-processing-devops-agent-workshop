events {
    worker_connections 1024;
}

http {
    # ---- Hardening / common defaults ----
    server_tokens off;
    client_max_body_size 2M;

    # ---- Upstreams ----
    upstream auth_service        { server auth-service:8001; }
    upstream customer_service    { server customer-service:8002; }
    upstream loan_service        { server loan-service:8003; }
    upstream underwriting_service { server underwriting-service:8004; }
    upstream disbursement_service { server disbursement-service:8005; }
    upstream repayment_service   { server repayment-service:8006; }
    upstream collections_service { server collections-service:8007; }
    upstream notification_service { server notification-service:8008; }
    upstream audit_service       { server audit-service:8009; }
    upstream dashboard_service   { server dashboard-service:8010; }
    upstream frontend            { server frontend:80; }

    # ---- Logging ----
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"referrer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time'
        '}';
    access_log /var/log/nginx/access.log json_combined;

    server {
        listen 8000;
        server_name _;

        # ---- Security headers (defence-in-depth) ----
        # CORS is intentionally not handled here — each service has explicit
        # CORSMiddleware that uses the CORS_ALLOWED_ORIGINS env variable.
        # Enabling permissive CORS at the gateway would override that.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # OPTIONS preflight is handled by upstream services, not at the gateway.

        # ---- Health check ----
        location = /health {
            access_log off;
            return 200 '{"status":"healthy"}';
            default_type application/json;
        }

        # ---- API routes ----
        location /api/v1/auth/ {
            proxy_pass http://auth_service/api/v1/auth/;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/users {
            proxy_pass http://auth_service/api/v1/users;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/customers {
            proxy_pass http://customer_service/api/v1/customers;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/kyc {
            proxy_pass http://customer_service/api/v1/kyc;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/loan-products {
            proxy_pass http://loan_service/api/v1/loan-products;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/applications {
            proxy_pass http://loan_service/api/v1/applications;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/eligibility {
            proxy_pass http://loan_service/api/v1/eligibility;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/underwriting {
            proxy_pass http://underwriting_service/api/v1/underwriting;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/disbursements {
            proxy_pass http://disbursement_service/api/v1/disbursements;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/loans {
            proxy_pass http://disbursement_service/api/v1/loans;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/repayments {
            proxy_pass http://repayment_service/api/v1/repayments;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/collections {
            proxy_pass http://collections_service/api/v1/collections;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/notifications {
            proxy_pass http://notification_service/api/v1/notifications;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/audit {
            proxy_pass http://audit_service/api/v1/audit;
            include /etc/nginx/proxy_headers.conf;
        }

        location /api/v1/dashboard {
            proxy_pass http://dashboard_service/api/v1/dashboard;
            include /etc/nginx/proxy_headers.conf;
        }

        # ---- Frontend (catch-all) ----
        location / {
            proxy_pass http://frontend/;
            include /etc/nginx/proxy_headers.conf;
        }
    }
}
