# Reverse-proxy headers used by the local docker-compose nginx gateway.
# We use the nginx-set proxy_host variable for the upstream Host header,
# rather than client-supplied request headers, so an attacker cannot
# influence routing through this gateway.
proxy_set_header Host              $proxy_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $request_id;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
proxy_connect_timeout 5s;
